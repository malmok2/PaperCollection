name: Weekly nuclear literature digest

on:
  schedule:
    # 22:00 UTC Sunday = 07:00 KST Monday (GitHub cron can start up to ~1 h late).
    - cron: "0 22 * * 0"
    # Safety net: retry Monday 12:00 KST. Skips collection/email if the week already succeeded.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Monday to process (YYYY-MM-DD). Empty = this week"
        required: false
      no_email:
        description: "Do not send email"
        type: boolean
        default: false
      force_email:
        description: "Send even if already sent for this week"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publish: ${{ steps.guard.outputs.skip != 'true' }}
    env:
      TZ: Asia/Seoul
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Skip if this week already succeeded (retry trigger only)
        id: guard
        run: |
          monday=$(python -c "from datetime import date,timedelta; d=date.today(); print(d-timedelta(days=d.weekday()))")
          done=$(python -c "import json,sys; s=json.load(open('state/latest-run.json')); print(int(s.get('status')=='success' and s.get('run_date')=='$monday' and s.get('email','').startswith(('sent','skipped: already'))))" 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "1" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Run pipeline
        if: steps.guard.outputs.skip != 'true'
        run: |
          args=""
          [ -n "${{ inputs.run_date }}" ] && args="$args --run-date ${{ inputs.run_date }}"
          [ "${{ inputs.no_email }}" = "true" ] && args="$args --no-email"
          [ "${{ inputs.force_email }}" = "true" ] && args="$args --force-email"
          python -m pipeline.run_weekly $args

      - name: Commit data and outputs
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data state docs outputs
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Weekly digest $(python -c "import json; s=json.load(open('state/latest-run.json')); print(s['run_date'], s['status'])")"
          git push

      - name: Failure notice by email
        if: failure()
        run: |
          python -m pipeline.send_email --failure "주간 파이프라인이 실패했습니다.
          오류: $(python -c "import json; print(json.load(open('state/latest-run.json')).get('error','(see log)'))" 2>/dev/null)
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          성공 메일은 발송하지 않았습니다. Actions 화면에서 'Run workflow'로 재실행할 수 있습니다."

      - name: Upload Pages artifact
        if: success() && steps.guard.outputs.skip != 'true' && vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: digest
    if: vars.ENABLE_PAGES == 'true' && needs.digest.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
